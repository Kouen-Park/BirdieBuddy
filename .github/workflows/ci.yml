name: CI

# A branch with an open pull request used to run this workflow twice — once for
# `push` and once for `pull_request` — producing eight checks where four are
# meaningful and doubling exposure to runner flakiness. Feature branches are
# covered by the pull_request event; push only guards the default branch.
on:
  push:
    branches: [master]
  pull_request:

# Supersede an in-flight run when new commits arrive, except on master, where
# every merge deserves its own recorded result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: birdiebuddy_test_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d birdiebuddy_test_ci"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      BIRDIEBUDDY_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Database=birdiebuddy_test_ci;Username=postgres;Password=local-test-only
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test tests/BirdieBuddy.Tests/BirdieBuddy.Tests.csproj --configuration Release --filter Category=PostgreSQL
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore BirdieBuddy.csproj
      - run: dotnet build BirdieBuddy.csproj --configuration Release --no-restore
      - run: dotnet test tests/BirdieBuddy.Tests/BirdieBuddy.Tests.csproj --configuration Release
      - run: dotnet tool restore
      - name: Generate reviewable migration SQL
        run: dotnet ef migrations script --idempotent --configuration Release --no-build --output ./artifacts/migrations.sql
      - uses: actions/upload-artifact@v7
        with:
          name: postgres-migration-sql
          path: ./artifacts/migrations.sql
      - run: dotnet publish BirdieBuddy.csproj --configuration Release --no-restore --output ./artifacts/publish
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run test:browser
      - run: docker build --tag birdie-buddy-ci:${{ github.sha }} .
  browser-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: birdiebuddy_e2e_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d birdiebuddy_e2e_ci"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      BIRDIEBUDDY_E2E_POSTGRES: Host=127.0.0.1;Port=5432;Database=birdiebuddy_e2e_ci;Username=postgres;Password=local-test-only
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: dotnet restore BirdieBuddy.csproj
      - run: dotnet build BirdieBuddy.csproj --configuration Release --no-restore
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: output/playwright/
          if-no-files-found: ignore
  ios-tests:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.5'
      - name: Build and test SwiftUI client
        run: ./scripts/test-ios.sh
      - name: Upload iOS test diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-results
          path: output/ios/*.xcresult
          if-no-files-found: ignore
          retention-days: 7
