<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="manifest" href="/manifest.webmanifest" />
<meta name="theme-color" content="#0e211f" />
<title>Rounds · Birdie Buddy</title>
<link rel="stylesheet" href="css/styles.css?v=20260909-records" />
</head>
<body>
  <div class="app-shell">
    <nav class="sidebar" id="site-nav"></nav>

    <main class="main">
      <div class="page-header rounds-page-header">
        <div>
          <h1>Rounds</h1>
          <p>Every round you've recorded.</p>
        </div>
        <a href="live-round.html" class="btn btn-flag">Start round</a>
      </div>

      <form class="card round-filters" id="round-filters">
        <div class="field filter-search"><label for="filter-search">Search</label><input id="filter-search" type="search" placeholder="Course or tee" autocomplete="off" /></div>
        <div class="field"><label for="filter-course">Course</label><select id="filter-course"><option value="">All courses</option></select></div>
        <div class="field"><label for="filter-status">Status</label><select id="filter-status"><option value="">All statuses</option><option>Completed</option><option value="Draft">In progress</option><option>Abandoned</option></select></div>
        <div class="field"><label for="filter-holes">Round length</label><select id="filter-holes"><option value="">Any length</option><option value="9">9 holes</option><option value="18">18 holes</option></select></div>
        <div class="field"><label for="filter-from">From</label><input type="date" id="filter-from" /></div>
        <div class="field"><label for="filter-to">To</label><input type="date" id="filter-to" /></div>
        <button class="btn btn-secondary" type="submit">Apply filters</button>
      </form>

      <div id="rounds-content">
        <p class="progress-note">Loading&hellip;</p>
      </div>
    </main>
  </div>

  <script src="js/api.js?v=20260903-rail3"></script>
  <script src="js/rounds.js?v=20260909-round-filters"></script>
</body>
</html>
