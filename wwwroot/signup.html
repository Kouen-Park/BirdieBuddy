<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create account · Birdie Buddy</title>
    <link rel="stylesheet" href="css/styles.css?v=20260930-brand" />
    <link rel="icon" href="/icons/birdie-buddy.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" sizes="180x180" />
</head>
<body class="auth-page" data-auth-mode="register">
    <main class="auth-card">
        <a class="auth-brand" href="/" aria-label="Birdie Buddy home">
            <img class="brand-logo" src="/icons/birdiebuddy-logo.svg" alt="Birdie Buddy" width="197" height="40" />
        </a>
        <h1>Start your round log.</h1>
        <p>Create an account and keep your game history private to you.</p>
        <div id="auth-error" class="alert error auth-error" role="alert" hidden></div>
        <form id="auth-form" class="auth-form" novalidate>
            <div class="field">
                <label for="displayName">Display name</label>
                <input id="displayName" name="displayName" type="text" autocomplete="name" minlength="2" maxlength="80" required />
            </div>
            <div class="field">
                <label for="email">Email</label>
                <input id="email" name="email" type="email" autocomplete="email" required />
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required />
            </div>
            <button id="auth-submit" class="btn btn-flag" type="submit">Create account</button>
        </form>
        <p class="auth-switch">Already have an account? <a href="login.html">Sign in</a></p>
        <p class="auth-browse"><a href="/">Browse without an account</a></p>
    </main>
    <script src="js/auth.js?v=20260908-email-policy"></script>
</body>
</html>
