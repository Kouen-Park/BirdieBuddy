<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Courses · Birdie Buddy</title>
<link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div class="app-shell">
    <nav class="sidebar" id="site-nav"></nav>

    <main class="main">
      <div class="page-header">
        <h1>Courses</h1>
        <p>Courses you can select when adding a round.</p>
      </div>

      <div class="course-tools card">
        <div class="field"><label for="course-search">Find a course</label><input id="course-search" type="search" placeholder="Search by course or location" autocomplete="off" /></div>
      </div>
      <div class="section-title">Available courses</div>
      <div id="local-courses">
        <p class="progress-note">Loading&hellip;</p>
      </div>
    </main>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/courses.js"></script>
</body>
</html>
