<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Courses · Birdie Buddy</title>
<link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div class="app-shell">
    <nav class="sidebar" id="site-nav"></nav>

    <main class="main">
      <div class="page-header">
        <h1>Courses</h1>
        <p>Courses you can select when adding a round.</p>
      </div>

      <div class="section-title" style="margin-top:0;">Golf NZ course database</div>
      <div class="card" style="padding:16px;">
        <p class="progress-note" style="margin-top:0;">
          Load the bundled Golf New Zealand course database into Birdie Buddy. Existing courses,
          tees, and holes are updated instead of duplicated.
        </p>
        <button class="btn btn-flag" id="import-golf-nz-btn">Load Golf NZ courses</button>
        <div id="import-alert" style="margin-top:12px;"></div>
      </div>

      <div class="section-title">Your courses</div>
      <div id="local-courses">
        <p class="progress-note">Loading&hellip;</p>
      </div>
    </main>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/courses.js"></script>
</body>
</html>
