<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>Account · Birdie Buddy</title><link rel="stylesheet" href="/css/styles.css"/></head>
<body><div class="app-shell"><nav class="sidebar" id="site-nav" aria-label="Primary navigation"></nav><main class="main"><div class="page-header"><h1>Account</h1><p>Keep your profile and password up to date.</p></div><div id="account-alert" aria-live="polite"></div><div class="account-grid"><form class="card account-form" id="profile-form"><h2>Profile</h2><div class="field"><label for="account-email">Email</label><input id="account-email" disabled/></div><div class="field"><label for="display-name">Display name</label><input id="display-name" minlength="2" maxlength="80" required/></div><button class="btn btn-primary">Save profile</button></form><form class="card account-form" id="password-form"><h2>Change password</h2><div class="field"><label for="current-password">Current password</label><input id="current-password" type="password" autocomplete="current-password" required/></div><div class="field"><label for="new-password">New password</label><input id="new-password" type="password" minlength="8" autocomplete="new-password" required/><small>At least 8 characters with a letter and a number.</small></div><button class="btn btn-secondary">Change password</button></form></div></main></div><script src="/js/api.js"></script><script src="/js/account.js"></script></body></html>
