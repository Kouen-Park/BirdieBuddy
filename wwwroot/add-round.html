<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="manifest" href="/manifest.webmanifest" />
<meta name="theme-color" content="#0e211f" />
<title>Add Round · Birdie Buddy</title>
<link rel="stylesheet" href="css/styles.css?v=20260930-brand" />
    <link rel="icon" href="/icons/birdie-buddy.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" sizes="180x180" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="app-shell">
    <nav class="sidebar" id="site-nav"></nav>

    <main class="main" id="main" tabindex="-1">
      <div class="page-header">
        <h1>Add Round</h1>
        <p>Fill out your scorecard hole by hole.</p>
      </div>

      <div id="form-alert"></div>

      <div class="card">
        <div class="form-grid">
          <div class="field">
            <label for="course-select">Course</label>
            <select id="course-select"><option value="">Select a course&hellip;</option></select>
          </div>
          <div class="field">
            <label for="date-input">Date</label>
            <input type="date" id="date-input" />
          </div>
          <div class="field">
            <label for="tee-select">Tee</label>
            <select id="tee-select" disabled>
              <option value="">Select a course first&hellip;</option>
            </select>
            <input id="custom-tee-input" class="custom-tee-input" placeholder="Custom tee name" maxlength="80" hidden />
          </div>
        </div>
      </div>

      <div id="scorecard-wrapper"></div>
    </main>
  </div>

  <script src="js/api.js?v=20260930-brand"></script>
  <script src="js/add-round.js?v=20260903-rail3"></script>
</body>
</html>
