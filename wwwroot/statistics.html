<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Statistics · Birdie Buddy</title>
<link rel="stylesheet" href="/css/styles.css?v=20260903-rail3" />
</head>
<body>
  <div class="app-shell">
    <nav class="sidebar" id="site-nav"></nav>

    <main class="main">
      <div class="page-header">
        <h1>Statistics</h1>
        <p>Career averages and a breakdown of any individual round.</p>
      </div>

      <form class="card stats-filters" id="stats-filters">
        <div class="field"><label for="stats-course">Course</label><select id="stats-course"><option value="">All courses</option></select></div>
        <div class="field"><label for="stats-tee">Tee</label><select id="stats-tee" disabled><option value="">All tees</option></select></div>
        <div class="field"><label for="stats-holes">Round length</label><select id="stats-holes"><option value="">All rounds</option><option value="9">9 holes</option><option value="18">18 holes</option></select></div>
        <div class="field"><label for="stats-from">From</label><input id="stats-from" type="date" /></div>
        <div class="field"><label for="stats-to">To</label><input id="stats-to" type="date" /></div>
        <button class="btn btn-secondary">Update view</button>
      </form>

      <div id="overview-content">
        <p class="progress-note">Loading&hellip;</p>
      </div>

      <div class="section-title">Round breakdown</div>
      <div class="card filter-card">
        <div class="field round-filter">
          <label for="round-select">Choose a round</label>
          <select id="round-select"></select>
        </div>
      </div>

      <div id="round-breakdown" class="round-breakdown"></div>
    </main>
  </div>

  <script src="/js/api.js?v=20260903-rail3"></script>
  <script src="/js/statistics-view.js?v=20260903-rail3"></script>
  <script src="/js/statistics.js?v=20260903-rail3"></script>
</body>
</html>
